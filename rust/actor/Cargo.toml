[package]
name = "actor"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
error-collection = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-util = "0"
tonic = { version = "0" }
tracing = "0"

[dev-dependencies]
itertools = "0"
test-log = { version = "0", features = ["trace", "color"] }
tokio-test = "0"
